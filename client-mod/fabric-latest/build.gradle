plugins { id 'net.fabricmc.fabric-loom' }
version = '1.2.0'
base { archivesName = 'hydarium-fabric-latest' }
repositories { mavenCentral() }
sourceSets { main { java { srcDirs = ['src/main/java', '../fabric-common/src', '../core/src'] } } }
/* Le dessin DANS le jeu est compilé en DEUX morceaux, à part, SANS faire échouer la construction : si une API de cette version a changé, les classes concernées
   manquent dans le jar (le mod se charge quand même, luminosité / zoom / sprint / code P2P marchent, et le HUD du launcher prend le relais) au lieu de tout casser.
     - « draw »    : HUD (Draw, HudCanvas, Gx) : presque tout par réflexion, donc quasi insensible aux changements du jeu ;
     - « screens » : éditeur et menu (HudScreen, MenuScreen) : étendent Screen, donc liés à sa signature. Compilés séparément pour qu'une erreur ici n'emporte PAS le HUD.
   Les erreurs de compilation restent affichées dans le journal, et la CI signale clairement les classes manquantes. */
sourceSets {
  draw { java { srcDirs = ['src/draw/java'] } }
  screens { java { srcDirs = ['src/screens/java'] } }
}
sourceSets.draw.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.draw.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
sourceSets.screens.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.draw.output
sourceSets.screens.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.draw.output
tasks.named('compileDrawJava') { options.failOnError = false }
tasks.named('compileScreensJava') { options.failOnError = false; dependsOn tasks.named('compileDrawJava') }
dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  implementation "net.fabricmc:fabric-loader:${project.loader_version}"
  implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
jar { archiveFileName = 'hydarium-latest.jar'; from sourceSets.draw.output; from sourceSets.screens.output }
