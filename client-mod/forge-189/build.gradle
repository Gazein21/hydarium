// Dépôts de secours en dernier : les outils de Forge 1.8.9 sont anciens, certains fichiers ne se trouvent plus que sur ces dépôts.
buildscript {
  repositories { mavenCentral(); maven { name = 'forge'; url = 'https://maven.minecraftforge.net/' }; maven { url = 'https://repo.spongepowered.org/maven' }; maven { url 'https://plugins.gradle.org/m2/' }; jcenter() }
  dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT' }
}
apply plugin: 'net.minecraftforge.gradle.forge'
version = '1.1.0'
group = 'net.hydarium'
archivesBaseName = 'hydarium-forge-1.8.9'
sourceCompatibility = targetCompatibility = '1.8'
sourceSets.main.java.srcDirs += ['../core/src']
minecraft { version = '1.8.9-11.15.1.2318-1.8.9'; runDir = 'run'; mappings = 'stable_22' }
processResources {
  inputs.property 'version', project.version; inputs.property 'mcversion', project.minecraft.version
  from(sourceSets.main.resources.srcDirs) { include 'mcmod.info'; expand 'version': project.version, 'mcversion': project.minecraft.version }
  from(sourceSets.main.resources.srcDirs) { exclude 'mcmod.info' }
}
jar { archiveName = 'hydarium-1.8.9.jar' }
