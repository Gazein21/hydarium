name: Build Windows, Linux et macOS
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  win:
    runs-on: windows-latest
    permissions: { contents: write }
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Mode Hydarium : un jar par époque du jeu. Chaque build est indépendant et « continue-on-error » : si l’un échoue, le launcher est quand même construit
      # (il utilisera alors le HUD externe pour cette version). Les jars n’ont jamais été compilés contre Minecraft avant la première exécution de cette CI : lire les journaux.
      - run: New-Item -ItemType Directory -Force build-client | Out-Null
      - name: Test du cœur commun du mod (Java 8)
        run: |
          New-Item -ItemType Directory -Force build-core | Out-Null
          $src = Get-ChildItem client-mod/core/src -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 8 -encoding UTF-8 -d build-core $src client-mod/core/test/CoreTest.java
          java "-Dfile.encoding=UTF-8" -cp build-core CoreTest
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.8' }
      - name: Mod Hydarium 1.20.1 (Fabric)
        continue-on-error: true
        run: |
          gradle -p client-mod/fabric-120 build
          Copy-Item client-mod/fabric-120/build/libs/hydarium-1.20.1.jar build-client/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Mod Hydarium 1.21 – 1.21.1 (Fabric)
        continue-on-error: true
        run: |
          gradle -p client-mod/fabric-121 build
          Copy-Item client-mod/fabric-121/build/libs/hydarium-1.21.1.jar build-client/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '9.6.0' }
      - name: Mod Hydarium versions récentes (Fabric 26.x)
        continue-on-error: true
        shell: pwsh
        run: |
          gradle -p client-mod/fabric-latest build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item client-mod/fabric-latest/build/libs/hydarium-latest.jar build-client/
          # Le dessin en jeu est compilé « sans faire échouer » le reste : on vérifie ici que ses classes sont bien dans le jar, sinon on le dit clairement.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path build-client/hydarium-latest.jar).Path)
          $have = @($zip.Entries | ForEach-Object { $_.FullName }); $zip.Dispose()
          $need = 'net/hydarium/client/Draw.class', 'net/hydarium/client/HudCanvas.class', 'net/hydarium/client/Gx.class', 'net/hydarium/client/HudScreen.class', 'net/hydarium/client/MenuScreen.class', 'net/hydarium/client/mixin/ServerAddressMixin.class'
          $missing = @($need | Where-Object { $have -notcontains $_ })
          # Fiche du jar livré : version du jeu visée + présence du dessin. Le launcher s'en sert pour ne PAS garder ce jar sur une autre version du jeu ou s'il n'a pas de dessin
          # (il fabrique alors le bon mod sur place, voir src/main/modplan.js).
          $mc = ((Get-Content client-mod/fabric-latest/gradle.properties | Where-Object { $_ -match '^minecraft_version=' }) -replace '^minecraft_version=', '').Trim()
          $hasDraw = -not ($missing | Where-Object { $_ -match 'Draw|HudCanvas|Gx' })
          (@{ mc = $mc; draw = [bool]$hasDraw } | ConvertTo-Json -Compress) | Set-Content -Encoding utf8 build-client/hydarium-latest.json
          if ($missing.Count -gt 0) { Write-Host "::error title=Mod 26.x - classes absentes::Compilation en échec (voir les lignes « error: » plus haut dans ce journal) : $($missing -join ', ')" } else { Write-Host 'Mod 26.x : HUD, éditeur, menu et code P2P sont bien dans le jar.' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 8 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '2.14.1' }
      - name: Mod Hydarium 1.8.9 (Forge)
        continue-on-error: true
        run: |
          gradle -p client-mod/forge-189 build
          Copy-Item client-mod/forge-189/build/libs/hydarium-1.8.9.jar build-client/
      # Les jars du mod sont fabriqués ici (une seule fois) puis réutilisés tels quels par le job Linux ci-dessous.
      - uses: actions/upload-artifact@v4
        with:
          name: Hydarium-Mods
          path: build-client/*
          if-no-files-found: warn
      - run: npm install
      - name: Tests
        continue-on-error: true   # un test en échec est signalé (annotation) mais ne bloque pas la construction de l'installateur
        run: npm test
      # Logo : la méthode officielle d'electron-builder (incrustation de l'icône + identité de l'exécutable) est activée ICI, sur le serveur GitHub, où elle marche toujours.
      # En local (build-windows.bat) elle reste désactivée (elle exige des droits de liens symboliques) et scripts/after-pack.js incruste le logo à la place.
      - name: Installeur Windows
        id: dist1
        continue-on-error: true
        run: npm run dist:win -- --config.win.signAndEditExecutable=true
      - name: "Installeur Windows (repli, logo incrusté par after-pack.js)"
        if: steps.dist1.outcome == 'failure'
        run: npm run dist:win
      - name: Vérifier le logo de l'exécutable
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/Hydarium.exe'
          $v = (Get-Item $exe).VersionInfo
          Write-Host ("Hydarium.exe : ProductName='{0}' FileDescription='{1}' taille={2:N0}" -f $v.ProductName, $v.FileDescription, (Get-Item $exe).Length)
          if ($v.ProductName -notmatch 'Hydarium') { Write-Host "::error title=Logo / identité de l'exécutable::Hydarium.exe porte encore l'identité d'Electron (ProductName='$($v.ProductName)') : le logo n'a pas été incrusté." }
          # Comparaison de l'icône extraite de l'exécutable avec build/icon.png (réduite à 32 px) : l'icône d'Electron est très différente de celle d'Hydarium
          Add-Type -AssemblyName System.Drawing
          $a = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path).ToBitmap()
          $src = [System.Drawing.Image]::FromFile((Resolve-Path 'build/icon.png').Path)
          $b = New-Object System.Drawing.Bitmap 32, 32; $g = [System.Drawing.Graphics]::FromImage($b); $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($src, 0, 0, 32, 32); $g.Dispose()
          $a32 = New-Object System.Drawing.Bitmap 32, 32; $g2 = [System.Drawing.Graphics]::FromImage($a32); $g2.DrawImage($a, 0, 0, 32, 32); $g2.Dispose()
          $diff = 0; $n = 0
          for ($y = 0; $y -lt 32; $y += 2) { for ($x = 0; $x -lt 32; $x += 2) { $p = $a32.GetPixel($x, $y); $q = $b.GetPixel($x, $y); if ($p.A -gt 128 -or $q.A -gt 128) { $diff += [Math]::Abs($p.R - $q.R) + [Math]::Abs($p.G - $q.G) + [Math]::Abs($p.B - $q.B); $n++ } } }
          $avg = if ($n) { $diff / $n / 3 } else { 255 }
          Write-Host ("Écart moyen entre l'icône de Hydarium.exe et le logo : {0:N1} / 255" -f $avg)
          if ($avg -gt 45) { Write-Host "::error title=Logo non incrusté::L'icône de Hydarium.exe ne ressemble pas au logo d'Hydarium (écart $([int]$avg)/255)." }
      # Le petit installeur télécharge « hydarium-launcher-<version>-x64.nsis.7z » depuis la Release, et le launcher se met à jour grâce à latest.yml :
      # si l’un de ces fichiers manque, on arrête tout ici plutôt que de publier une Release inutilisable.
      - name: Vérifier les fichiers de la Release
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Where-Object { $_.FullName -notmatch 'win-unpacked' } | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Substring((Get-Location).Path.Length + 1) }
          # Indispensables : le petit installeur et le programme qu'il télécharge
          $need = @('dist/nsis-web/Hydarium-Setup-*.exe', 'dist/nsis-web/hydarium-launcher-*-x64.nsis.7z')
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if ($missing) { Write-Error ("Fichiers manquants : " + ($missing -join ', ')); exit 1 }
          # Utiles mais pas bloquants : version portable, et latest.yml (mise à jour automatique)
          if (-not (Test-Path 'dist/Hydarium-Portable-*.exe')) { Write-Host '::warning::Version portable absente de la Release' }
          if (-not ((Test-Path 'dist/latest.yml') -or (Test-Path 'dist/nsis-web/latest.yml'))) { Write-Host '::warning::latest.yml absent : la mise à jour automatique ne fonctionnera pas' }
          # Copie au nom FIXE, pour un lien de téléchargement qui ne change jamais : .../releases/latest/download/Hydarium-Installer.exe
          Copy-Item (Get-Item 'dist/nsis-web/Hydarium-Setup-*.exe').FullName 'dist/nsis-web/Hydarium-Installer.exe'
      - name: Lire la version
        id: v
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$ver" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Hydarium-Windows
          path: |
            dist/nsis-web/*.exe
            dist/nsis-web/*.7z
            dist/*.exe
            dist/*.yml
            dist/nsis-web/*.yml
      # Publie la Release « v<version de package.json> » : sur un tag poussé, comme sur « Run workflow » (le tag est alors créé automatiquement).
      # Relancer pour la même version remplace les fichiers de cette Release.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hydarium ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            dist/nsis-web/Hydarium-Installer.exe
            dist/nsis-web/Hydarium-Setup-*.exe
            dist/nsis-web/*.7z
            dist/Hydarium-Portable-*.exe
            dist/latest.yml
            dist/nsis-web/latest.yml

  # Version Linux : AppImage (un seul fichier, aucune installation : « chmod +x » puis double-clic). Elle se met à jour toute seule grâce à latest-linux.yml.
  # Lancée APRÈS le job Windows : elle reprend ses jars du mod et ajoute ses fichiers à la même Release.
  linux:
    needs: win
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Récupérer les jars du mod (construits par le job Windows)
        continue-on-error: true   # sans eux, le launcher fonctionne quand même (HUD externe) et fabrique le mod sur place
        uses: actions/download-artifact@v4
        with:
          name: Hydarium-Mods
          path: build-client
      - run: mkdir -p build-client
      - run: npm install
      - name: AppImage Linux
        run: npm run dist:linux
      - name: Vérifier les fichiers de la Release
        run: |
          ls -lh dist
          ls dist/Hydarium-*.AppImage || { echo "::error::AppImage absente"; exit 1; }
          [ -f dist/latest-linux.yml ] || echo "::warning::latest-linux.yml absent : la mise à jour automatique ne fonctionnera pas sous Linux"
          # Copie au nom FIXE, pour un lien qui ne change jamais : .../releases/latest/download/Hydarium-Linux.AppImage
          cp dist/Hydarium-*.AppImage dist/Hydarium-Linux.AppImage
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
        id: v
      - uses: actions/upload-artifact@v4
        with:
          name: Hydarium-Linux
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hydarium ${{ steps.v.outputs.version }}
          files: |
            dist/Hydarium-Linux.AppImage
            dist/Hydarium-*.AppImage
            dist/latest-linux.yml

  # Version macOS : deux DMG (Intel et Apple Silicon), fabriqués l'un après l'autre sur le même Mac (macos-latest) : le Java embarqué change d'architecture (HYDARIUM_ARCH).
  # Lancée APRÈS le job Windows, comme Linux : elle reprend ses jars du mod. Pas de compte développeur Apple → app non notarisée (signature « ad hoc » faite par scripts/after-pack.js).
  # Pas de mise à jour automatique sous macOS (elle exige une app signée) : le launcher prévient et renvoie vers la page de téléchargement (voir updater.js).
  mac:
    needs: win
    runs-on: macos-latest
    permissions: { contents: write }
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Récupérer les jars du mod (construits par le job Windows)
        continue-on-error: true   # sans eux, le launcher fonctionne quand même (HUD externe) et fabrique le mod sur place
        uses: actions/download-artifact@v4
        with:
          name: Hydarium-Mods
          path: build-client
      - run: mkdir -p build-client
      - run: npm install
      - name: DMG macOS Apple Silicon (arm64)
        run: |
          rm -rf build-jre
          HYDARIUM_ARCH=arm64 npm run dist:mac -- --arm64
      - name: DMG macOS Intel (x64)
        run: |
          rm -rf build-jre
          HYDARIUM_ARCH=x64 npm run dist:mac -- --x64
      - name: Vérifier les fichiers de la Release
        id: v
        run: |
          ls -lh dist
          ls dist/Hydarium-*-arm64.dmg dist/Hydarium-*-x64.dmg || { echo "::error::DMG absent"; exit 1; }
          # Copies aux noms FIXES, pour des liens qui ne changent jamais : .../releases/latest/download/Hydarium-Mac-AppleSilicon.dmg (et -Intel)
          cp dist/Hydarium-*-arm64.dmg dist/Hydarium-Mac-AppleSilicon.dmg
          cp dist/Hydarium-*-x64.dmg dist/Hydarium-Mac-Intel.dmg
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Hydarium-macOS
          path: dist/*.dmg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Hydarium ${{ steps.v.outputs.version }}
          files: |
            dist/Hydarium-Mac-AppleSilicon.dmg
            dist/Hydarium-Mac-Intel.dmg
            dist/Hydarium-*-arm64.dmg
            dist/Hydarium-*-x64.dmg
