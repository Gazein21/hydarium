name: Build Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  win:
    runs-on: windows-latest
    permissions: { contents: write }
    env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # Mode Hydarium : un jar par époque du jeu. Chaque build est indépendant et « continue-on-error » : si l’un échoue, le launcher est quand même construit
      # (il utilisera alors le HUD externe pour cette version). Les jars n’ont jamais été compilés contre Minecraft avant la première exécution de cette CI : lire les journaux.
      - run: New-Item -ItemType Directory -Force build-client | Out-Null
      - name: Test du cœur commun du mod (Java 8)
        run: |
          New-Item -ItemType Directory -Force build-core | Out-Null
          $src = Get-ChildItem client-mod/core/src -Recurse -Filter *.java | ForEach-Object { $_.FullName }
          javac --release 8 -encoding UTF-8 -d build-core $src client-mod/core/test/CoreTest.java
          java "-Dfile.encoding=UTF-8" -cp build-core CoreTest
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.8' }
      - name: Mod Hydarium 1.20.1 (Fabric)
        continue-on-error: true
        run: |
          gradle -p client-mod/fabric-120 build
          Copy-Item client-mod/fabric-120/build/libs/hydarium-1.20.1.jar build-client/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Mod Hydarium 1.21 – 1.21.1 (Fabric)
        continue-on-error: true
        run: |
          gradle -p client-mod/fabric-121 build
          Copy-Item client-mod/fabric-121/build/libs/hydarium-1.21.1.jar build-client/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '9.2.1' }
      - name: Mod Hydarium versions récentes (Fabric 26.x)
        continue-on-error: true
        run: |
          gradle -p client-mod/fabric-latest build
          Copy-Item client-mod/fabric-latest/build/libs/hydarium-latest.jar build-client/
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 8 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '2.14.1' }
      - name: Mod Hydarium 1.8.9 (Forge)
        continue-on-error: true
        run: |
          gradle -p client-mod/forge-189 build
          Copy-Item client-mod/forge-189/build/libs/hydarium-1.8.9.jar build-client/
      - run: npm install
      - name: Tests
        run: npm test
      - run: npm run dist:win
      # Le petit installeur télécharge « hydarium-launcher-<version>-x64.nsis.7z » depuis la Release, et le launcher se met à jour grâce à latest.yml :
      # si l’un de ces fichiers manque, on arrête tout ici plutôt que de publier une Release inutilisable.
      - name: Vérifier les fichiers de la Release
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | Where-Object { $_.FullName -notmatch 'win-unpacked' } | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.FullName.Substring((Get-Location).Path.Length + 1) }
          $need = @('dist/nsis-web/Hydarium-Setup-*.exe', 'dist/nsis-web/hydarium-launcher-*-x64.nsis.7z', 'dist/Hydarium-Portable-*.exe')
          $missing = $need | Where-Object { -not (Test-Path $_) }
          if (-not ((Test-Path 'dist/latest.yml') -or (Test-Path 'dist/nsis-web/latest.yml'))) { $missing += 'latest.yml' }
          if ($missing) { Write-Error ("Fichiers manquants : " + ($missing -join ', ')); exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: Hydarium-Windows
          path: |
            dist/nsis-web/*.exe
            dist/nsis-web/*.7z
            dist/*.exe
            dist/*.yml
            dist/nsis-web/*.yml
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/nsis-web/Hydarium-Setup-*.exe
            dist/nsis-web/*.7z
            dist/Hydarium-Portable-*.exe
            dist/latest.yml
            dist/nsis-web/latest.yml
